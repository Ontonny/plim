# Rustfmt configuration for consistent code formatting
# This file configures rustfmt, the official Rust code formatter

# Edition to use (should match Cargo.toml)
edition = "2024"

# Maximum width of each line
max_width = 100

# Hard tab stops
hard_tabs = false

# Number of spaces per tab
tab_spaces = 4

# Indent style
indent_style = "Block"

# Line ending style
newline_style = "Unix"

# Use chain formatting
use_small_heuristics = "Default"

# Format string literals
format_strings = true

# Format code in doc comments
format_code_in_doc_comments = true

# Format macro definitions
format_macro_matchers = true

# Format macro bodies
format_macro_bodies = true

# Format macro definitions
format_macro_definitions = true

# Reorder imports
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Reorder items
reorder_impl_items = true

# Reorder mod declarations
reorder_modules = true

# Remove trailing commas
remove_nested_parens = true

# Spaces around function call arguments
space_after_colon = true
space_before_colon = false

# Spaces around type ascriptions
space_around_eq = true

# Spaces in function signatures
spaces_around_ranges = false

# Brace style
brace_style = "SameLineWhere"

# Control flow style
control_brace_style = "AlwaysSameLine"

# Where clause style
where_single_line = false

# Trailing commas
trailing_comma = "Vertical"

# Trailing semicolons
trailing_semicolon = true

# Use try blocks
use_try_shorthand = true

# Use field init shorthand
use_field_init_shorthand = true

# Blank lines
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1

# Comment formatting
comment_width = 80
normalize_comments = true
wrap_comments = true

# Documentation
format_doc_comment = true
doc_comment_code_block_width = 100

# Function formatting
fn_args_layout = "Tall"
fn_single_line = false

# Struct and enum formatting
struct_lit_single_line = true
struct_lit_width = 18
struct_variant_width = 18

# Array formatting
array_width = 60

# Chain formatting
chain_width = 80
single_line_if_else_max_width = 50

# Match formatting
match_arm_leading_pipes = "Never"
match_arm_blocks = "Always"
match_block_trailing_comma = true

# Closure formatting
closure_style = "Block"

# Expression formatting
binop_separator = "Front"
control_brace_style = "AlwaysSameLine"

# Attribute formatting
attr_fn_like_split = true

# Macro formatting
format_macro_matchers = true
format_macro_bodies = true
format_macro_definitions = true

# Import formatting
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
imports_layout = "Mixed"

# Module formatting
reorder_modules = true

# Type formatting
type_punctuation_density = "Wide"
space_after_colon = true
space_before_colon = false

# Visibility formatting
use_small_heuristics = "Default"
